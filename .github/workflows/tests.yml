name: Tests

on:
  push:
    branches: [beta, main]
  pull_request:
    branches: [beta, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pico Link regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Lint
        run: python -m ruff check custom_components/pico_link tests
      - name: Frontend syntax and draft tests
        run: |
          node --check custom_components/pico_link/frontend/pico-link-panel.js
          node --test tests/frontend-model.test.mjs
      - name: Run regression tests
        run: >-
          python -m pytest -q
          --cov=custom_components.pico_link
          --cov-branch
          --cov-report=term-missing
  minimum:
    name: Minimum Home Assistant compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-test-minimum.txt
      - name: Install minimum-version test dependencies
        run: python -m pip install -r requirements-test-minimum.txt
      - name: Run regression tests on Home Assistant 2026.4.0
        run: python -m pytest -q
